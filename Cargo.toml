[package]
name = "sliderino"
version = "0.2.0"
description = "Presentation editor with complete programmatic control for agents, through a CLI and an MCP server"
edition = "2024"
# GPUI follows the current stable compiler. The release builds with it.
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/tncardoso/sliderino"
homepage = "https://github.com/tncardoso/sliderino"
readme = "README.md"
keywords = ["presentation", "slides", "editor", "mcp", "agent"]
categories = ["command-line-utilities", "multimedia"]
default-run = "sliderino"
# The only binary is `sliderino`; `sliderino-debug` is an example, below.
autobins = false
# What goes to crates.io. The debug scenes, the sample deck and the tools stay
# in the repository.
include = ["/src", "/assets", "/Cargo.toml", "/README.md", "/LICENSE"]

[[bin]]
name = "sliderino"
path = "src/main.rs"

# A tool for contributors, and an example so that `dist` does not put it in the
# release archives: `dist` ships each `[[bin]]` and does not read
# `required-features`. Run it with `cargo run --example sliderino-debug`.
[[example]]
name = "sliderino-debug"
path = "src/bin/sliderino-debug.rs"

[dependencies]
async-channel = "2"
base64 = "0.22"
clap = { version = "4.6.7", features = ["derive", "env"] }
fontdb = "0.23"
gpui-kit = "0.6.6"
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-pbutils = "0.25"
gstreamer-video = "0.25"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
libc = "0.2"
naga = { version = "29", features = ["glsl-in"] }
pollster = "0.4"
rmcp = { version = "3.4.1", default-features = false, features = ["server", "transport-io"] }
roxmltree = "0.20"
rustybuzz = "0.20"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tiny-skia = "0.11"
tokio = { version = "1.53.1", features = ["rt", "io-std", "macros"] }
ttf-parser = "0.25"
unicode-linebreak = "0.1"
wgpu = { version = "29", features = ["naga-ir"] }
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[features]
# Timing spans for the benchmarks in src/ui/perf_tests.rs.
perf = []

[dev-dependencies]
gpui-kit = { version = "0.6.6", features = ["test-support"] }

# Optimize the dependencies (GPUI, text shaping) in debug builds: unoptimized,
# they make the editor lag. Sliderino itself still builds fast.
[profile.dev.package."*"]
opt-level = 2

# The profile that `dist` builds a release with.
[profile.dist]
inherits = "release"
lto = "thin"
