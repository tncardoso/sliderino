[package]
name = "sliderino"
version = "0.1.0"
edition = "2024"
default-run = "sliderino"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
fontdb = "0.23"
gpui-kit = "0.6.6"
rustybuzz = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.11"
ttf-parser = "0.25"
unicode-linebreak = "0.1"

[dev-dependencies]
gpui-kit = { version = "0.6.6", features = ["test-support"] }
