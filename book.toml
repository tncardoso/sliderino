[book]
authors = ["Thiago Cardoso"]
language = "en"
src = "docs"
title = "Sliderino"

[build]
# The book renders into the Hugo static tree, so it is served at /docs/.
# Build order: `mdbook build` first, then `hugo` from site/. `just site` does
# both.
build-dir = "site/static/docs"

[output.html]
git-repository-url = "https://github.com/tncardoso/sliderino"
theme = "book-theme"
site-url = "/docs/"
default-theme = "light"
preferred-dark-theme = "light"
additional-css = ["book-theme/sliderino.css"]
