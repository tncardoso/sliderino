{{- /*
  The Sliderino mark: an outlined slide behind a filled blue one. The outline
  takes currentColor, so the header draws it dark and the footer draws it
  light. book-theme/index.hbs holds a copy of this SVG.
*/ -}}
<svg class="logo-mark" width="30" height="22" viewBox="0 0 30 22" aria-hidden="true">
  <rect x="10" y="2" width="18" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="3"/>
  <rect x="0" y="9" width="17" height="12" rx="2.5" fill="#1F4BFF"/>
</svg>
